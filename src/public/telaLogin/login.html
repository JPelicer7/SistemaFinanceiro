<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sistema Financeiro</title>
  <link rel="stylesheet" href="/telaLogin/style.css" />
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <h1>Sistema Financeiro</h1>
      <p class="subtitle">Entre para gerenciar suas finanças</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="seuemail@email.com" required />
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="password" placeholder="********" required />
        </div>

        <button type="submit">Entrar</button>
      </form>

      <p class="register-text">
        Não tem conta? <a href="/register/register.html">Criar conta</a>
      </p>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/telaLogin/login.js"></script>
</body>
</html>
