<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta | Sistema Financeiro</title>
  <link rel="stylesheet" href="/register/style.css" />
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <h1>Criar Conta</h1>
      <p class="subtitle">Crie sua conta para começar</p>

      <form id="registerForm">

        <div class="input-group">
          <label>Nome</label>
          <input type="text" id="name" placeholder="Seu nome" required />
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="seuemail@email.com" required />
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="password" placeholder="********" required />
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <p class="register-text">
        Já tem conta? <a href="/telaLogin/login.html">Entrar</a>
      </p>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/register/register.js"></script>
</body>
</html>
