<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Financeiro</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">

    <header class="header">
      <h1>Sistema Financeiro</h1>
    </header>

    <section class="dashboard-cards">
      <!-- <p>Saldo Total</p>
      <h2 id="balance">Carregando...</h2> -->

      <div class="card balance">
        <p>Saldo Total</p>
        <h2 id="balance">R$ 0,00</h2>
      </div>

      <div class="card income">
        <p>Receitas</p>
        <h2 id="income">R$ 0,00</h2>
      </div>

      <div class="card expenses">
        <p>Despesas</p>
        <h2 id="expenses">R$ 0,00</h2>
      </div>

    </section>

    <section class="transactions">
      <h3>Minhas Transações</h3>
      <input type="hidden" id="transaction-id">
      <div id="confirmToast" class="confirm-toast hidden"></div>

      <div class="actions">
        <button id="btnAddTransaction">+ Adicionar Transação</button>
        <button id="btnAddCategory">+ Adicionar Categoria</button>
        <button onclick="goToSummaryHistory()" id="btnAddSummary">
            📊 Ver Histórico Mensal
        </button>

        <button id="btnGenerateSummary">
          + Gerar Histórico do Mês
        </button>

      </div>

      <ul class="transaction-list" id="transactions-list"></ul>
    </section>
  </div>

  <!-- Modal Editar Transação -->
 <div id="editModal" class="modal hidden"> 
      <div class="modal-content">
        <h3>Editar Transação</h3>

        <input type="hidden" id="edit-transaction-id">

        <label>Descrição</label>
        <input type="text" id="edit-description" placeholder="Descrição">

        <label>Valor</label>
        <input type="number" id="edit-amount" placeholder="Valor">

        <label>Tipo</label>
        <select id="edit-type">
          <option value="Receita">Receita</option>
          <option value="Despesa">Despesa</option>
        </select>

        <label>Categoria</label>
        <select id="edit-category"></select>

        <div class="modal-actions">
          <button id="btnSaveEdit">Salvar</button>
          <button id="btnCancelEdit">Cancelar</button>
        </div>
      </div>
  </div>


  <script src="/telaInicial/telaInicial.js"></script>
</body>
</html>
