<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Financeiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header class="header">
      <h1>Sistema Financeiro</h1>
    </header>

    <section class="balance-card">
      <p>Saldo Total</p>
      <h2 id="balance">Carregando...</h2>
    </section>

    <section class="transactions">
      <h3>Minhas Transações</h3>
      
      <div class="actions">
        <button id="btnAddTransaction">+ Adicionar Transação</button>
      </div>

      <ul class="transaction-list" id="transactions-list"></ul>
    </section>

  </div>

  <script src="/telaInicial/telaInicial.js"></script>
</body>
</html>
